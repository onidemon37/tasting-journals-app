apiVersion: v1
kind: Secret
metadata:
  name: tasting-journals-database
  namespace: tasting-journals-local
type: Opaque
stringData:
  DATABASE_URL: postgres://tasting_journals:dev-only-password@postgres:5432/tasting_journals?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tasting-journals-local
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tasting-journals-local
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: tasting_journals
            - name: POSTGRES_USER
              value: tasting_journals
            - name: POSTGRES_PASSWORD
              value: dev-only-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U tasting_journals -d tasting_journals"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
