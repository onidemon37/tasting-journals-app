apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasting-journals
  labels:
    app.kubernetes.io/name: tasting-journals
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tasting-journals
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasting-journals
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/onidemon37/tasting-journals-app:sha-5cbd12c
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tasting-journals-database
                  key: DATABASE_URL
            - name: APP_ADDRESS
              value: ":8080"
            - name: APP_NAME
              value: Tasting Journals
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
