name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint application
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            npm ci
            npm run lint --if-present
          elif [[ -f go.mod ]]; then
            go vet ./...
          elif [[ -f pyproject.toml || -f requirements.txt ]]; then
            python3 -m compileall -q .
          else
            echo 'Application source is not present yet; skipping application lint.'
          fi

  validate:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate JavaScript
        if: hashFiles('**/*.js') != ''
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*')
      - name: Validate application
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
            npm test --if-present
            npm run lint --if-present
            npm run build --if-present
          elif [[ -f go.mod ]]; then
            go test ./...
            go vet ./...
          elif [[ -f pyproject.toml || -f requirements.txt ]]; then
            python3 -m compileall -q .
          else
            echo 'Application source is not present yet; repository validation is complete.'
          fi
      - name: Validate deployment manifests
        shell: bash
        run: |
          if [[ -f deploy/base/kustomization.yaml ]]; then
            kubectl kustomize deploy/base >/dev/null
          else
            echo 'Deployment manifests are not present yet; skipping Kustomize validation.'
          fi
      - name: Validate optional local Kubernetes manifests
        shell: bash
        run: |
          if [[ -f optional/local-kubernetes/kustomization.yaml ]]; then
            kubectl kustomize optional/local-kubernetes >/dev/null
          else
            echo 'Optional local Kubernetes manifests are not present; skipping validation.'
          fi
