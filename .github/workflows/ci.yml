name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Lint application
        shell: bash
        run: make lint

  validate:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate JavaScript
        if: hashFiles('**/*.js') != ''
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*')
      - name: Validate application
        run: make test build
      - name: Validate deployment manifests
        shell: bash
        run: make k8s-render
      - name: Validate optional local Kubernetes manifests
        shell: bash
        run: make k8s-validate
