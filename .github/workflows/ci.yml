name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        if: hashFiles('**/*.js') != ''
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*')
      - name: Validate application
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
            npm test --if-present
            npm run lint --if-present
            npm run build --if-present
          elif [[ -f go.mod ]]; then
            go test ./...
            go vet ./...
          elif [[ -f pyproject.toml || -f requirements.txt ]]; then
            python3 -m compileall -q .
          else
            echo 'Application source is not present yet; repository validation is complete.'
          fi
      - name: Validate deployment manifests
        shell: bash
        run: |
          if [[ -d deploy ]]; then
            kubectl kustomize deploy >/dev/null
          else
            echo 'Deployment manifests are not present yet; skipping Kustomize validation.'
          fi
