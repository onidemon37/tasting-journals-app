{{define "new-tasting.html"}}{{template "layout" .}}{{end}}
{{define "content"}}<a class="back" href="/tastings">← All tastings</a><section class="page-head form-head"><p class="eyebrow">New entry</p><h1>Record a pour.</h1><p class="lede">Capture the details while they are still fresh.</p></section><form class="tasting-form" method="post" action="/tastings"><fieldset><legend>The bottle</legend><label>Name <input name="name" required autofocus></label><label>Distillery <input name="distillery"></label><div class="form-grid"><label>Region <input name="region"></label><label>Country <input name="country"></label><label>Age <input name="age" type="number" min="0"></label><label>ABV <input name="abv" type="number" min="0" max="100" step="0.1"></label><label>Cask type <input name="caskType"></label><label>Bottler <input name="bottler"></label><label>Date tasted <input name="dateTasted" type="date"></label><label>Rating <input name="rating" type="number" min="0" max="100"></label></div><label>Tags <input name="tags" placeholder="speyside, sherry, single-malt"><small>Separate tags with commas.</small></label></fieldset><fieldset><legend>Your notes</legend><label>Nose <textarea name="nose" rows="4"></textarea></label><label>Palate <textarea name="palate" rows="4"></textarea></label><label>Finish <textarea name="finish" rows="4"></textarea></label><label>Overall <textarea name="overall" rows="4"></textarea></label><label>What I learned <textarea name="whatLearned" rows="4"></textarea></label></fieldset><div class="form-actions"><a class="back" href="/tastings">Cancel</a><button class="button" type="submit">Save tasting <span>→</span></button></div></form>{{end}}
