{{define "edit-tasting.html"}}{{template "layout" .}}{{end}}
{{define "content"}}<a class="back" href="/tastings/{{.ID}}">← Back to tasting</a><section class="page-head form-head"><p class="eyebrow">Edit entry</p><h1>Refine the note.</h1><p class="lede">Keep the record honest as your understanding changes.</p></section><form class="tasting-form" method="post" action="/tastings/{{.ID}}"><fieldset><legend>The bottle</legend><label>Name <input name="name" value="{{.Name}}" required autofocus></label><label>Distillery <input name="distillery" value="{{.Distillery}}"></label><div class="form-grid"><label>Region <input name="region" value="{{.Region}}"></label><label>Country <input name="country" value="{{.Country}}"></label><label>Age <input name="age" type="number" min="0" value="{{if .Age}}{{.Age}}{{end}}"></label><label>ABV <input name="abv" type="number" min="0" max="100" step="0.1" value="{{if .ABV}}{{.ABVDisplay}}{{end}}"></label><label>Cask type <input name="caskType" value="{{.CaskType}}"></label><label>Bottler <input name="bottler" value="{{.Bottler}}"></label><label>Date tasted <input name="dateTasted" type="date" value="{{.DateTasted.Format "2006-01-02"}}"></label><label>Rating <input name="rating" type="number" min="0" max="100" value="{{if .Rating}}{{.Rating}}{{end}}"></label></div><label>Tags <input name="tags" value="{{range $index, $tag := .Tags}}{{if $index}}, {{end}}{{$tag}}{{end}}"></label></fieldset><fieldset><legend>Your notes</legend><label>Nose <textarea name="nose" rows="4">{{.Nose}}</textarea></label><label>Palate <textarea name="palate" rows="4">{{.Palate}}</textarea></label><label>Finish <textarea name="finish" rows="4">{{.Finish}}</textarea></label><label>Overall <textarea name="overall" rows="4">{{.Overall}}</textarea></label><label>What I learned <textarea name="whatLearned" rows="4">{{.WhatLearned}}</textarea></label></fieldset><div class="form-actions"><a class="back" href="/tastings/{{.ID}}">Cancel</a><button class="button" type="submit">Save changes <span>→</span></button></div></form>{{end}}
